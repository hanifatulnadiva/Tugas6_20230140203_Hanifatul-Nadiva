<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jumbo Playlist</title>
  <style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      
      .video-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: -1;
      }
      
      .video-background iframe {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        border: none;
      }
      
      .content {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        background: rgba(18, 18, 18, 0.6);
      }
      
      .player {
        background: #1e1e1e;
        border-radius: 10px;
        padding: 20px;
        width: 320px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      }
      
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      
      .header h2, button {
        font-size: 18px;
        margin: 0;
        color: #f5a623;
      }
      
      button {
        background: none;
        border: none;
        cursor: pointer;
      }
      
      button:hover {
        color: #fff;
      }
      
      .cover img {
        width: 100%;
        border-radius: 10px;
        margin-bottom: 10px;
      }
      
      .song-title {
        font-size: 20px;
        margin: 10px 0 5px;
      }
      
      .artist-name {
        font-size: 14px;
        color: #888;
      }
      
      .progress {
        width: 100%;
        height: 8px;
        margin: 20px 0;
        background: #555;
        border-radius: 5px;
      }
      
      .progress::-webkit-slider-thumb {
        appearance: none;
        width: 16px;
        height: 16px;
        background: #f5a623;
        border-radius: 50%;
        cursor: pointer;
      }
      
      .controls {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 10px;
      }
      
      audio {
        display: none;
      }
    </style>      
</head>
<body>

<!-- Video Background -->
<div class="video-background">
  <iframe 
    src="https://www.youtube.com/embed/18elkqVt-PI?autoplay=1&mute=1&controls=0&loop=1&playlist=18elkqVt-PI"
    frameborder="0"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>
</div>

<!-- Content -->
<div class="content">
  <div class="player">
    <div class="header">
      <button class="back-button">&#8592;</button>
      <h2>JUMBO PLAYLIST</h2>
      <button class="menu-button">&#8942;</button>
    </div>

    <div class="cover">
      <img src="https://tse4.mm.bing.net/th?id=OIP.b_ErakMc5QFM0FcMNb3WZwHaEK&pid=Api&P=0&h=180" alt="Jumbo">
    </div>

    <h3 class="song-title">JUMBO</h3>
    <p class="artist-name">Artist Jumbo</p>

    <input type="range" class="progress" id="progress-bar" value="0" max="100">

    <div class="controls">
      <button id="backward">&#9198;</button>
      <button id="play-pause">&#9658;</button>
      <button id="forward">&#9197;</button>
    </div>

    <audio id="audio">
      <source src="audio/jumbo.mp3" type="audio/mp3">
      Your browser does not support the audio element.
    </audio>
  </div>
</div>

<script>
  const audio = document.getElementById('audio');
  const playPauseButton = document.getElementById('play-pause');
  const progressBar = document.getElementById('progress-bar');
  const backwardButton = document.getElementById('backward');
  const forwardButton = document.getElementById('forward');

  let isPlaying = false;

  playPauseButton.addEventListener('click', function() {
    if (isPlaying) {
      audio.pause();
      playPauseButton.innerHTML = '&#9658;'; // Play icon
    } else {
      audio.play();
      playPauseButton.innerHTML = '&#9209;'; // Pause icon
    }
    isPlaying = !isPlaying;
  });

  audio.addEventListener('timeupdate', function() {
    const progress = (audio.currentTime / audio.duration) * 100;
    progressBar.value = progress || 0;
  });

  progressBar.addEventListener('input', function() {
    const time = (progressBar.value / 100) * audio.duration;
    audio.currentTime = time;
  });

  backwardButton.addEventListener('click', function() {
    audio.currentTime -= 10;
  });

  forwardButton.addEventListener('click', function() {
    audio.currentTime += 10;
  });
</script>

</body>
</html>
